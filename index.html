<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spell Checker with Text-to-Speech</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Spell Checker with Text-to-Speech</h1>
        <div class="input-area">
            <input type="text" id="word-input" placeholder="Enter a word..." autocomplete="off">
            <button id="check-button">Check & Read</button>
        </div>
        <div class="result-area">
            <div id="spelling-result" class="hidden">
                <h2>Spelling Check:</h2>
                <div id="spelling-feedback"></div>
                <div id="suggestions-container" class="hidden">
                    <h3>Did you mean:</h3>
                    <ul id="suggestions-list"></ul>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
